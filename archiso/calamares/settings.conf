---
modules-search:
  - local
  - /usr/lib/calamares/modules

instances:
  - module: packagechooser
    id: desktop
    config: desktop.conf
  - module: packagechooser
    id: bootloader
    config: bootloader-choice.conf
  - module: arachhardware
    id: hardware
    config: arach-hardware.conf
  - module: arachpacman
    id: hardware-payloads
    config: arach-pacman.conf
  - module: bootloader
    id: bootloader
    config: bootloader.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - packagechooser@desktop
      - packagechooser@bootloader
      - partition
      - users
      - summary
  - exec:
      - arachhardware@hardware
      - partition
      - mount
      - unpackfs
      - machineid
      - locale
      - keyboard
      - users
      - packages
      - arachpacman@hardware-payloads
      - bootloader@bootloader
      - umount
  - show:
      - finished

branding: arach
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
