[package]
name = "arach-compose"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/SisyphusAeolides/Arach-OS"
description = "Strict Arach OS image composition contract validator"
default-run = "arach-compose"

[dependencies]
arach-hwd = { git = "https://github.com/SisyphusAeolides/Arach-HWD.git", rev = "47f32e2f319577489c23fd6e241d79504b7cf5db" }
corinth = { git = "https://github.com/SisyphusAeolides/Corinth.git", rev = "73fa3c711f0a1059f31449c7edc5f4bb887e570c", features = ["host-store"] }
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
toml = "=0.9.12"

[lib]
path = "src/lib.rs"

[[bin]]
name = "arach-compose"
path = "src/main.rs"

[[bin]]
name = "arach-install"
path = "src/bin/arach-install.rs"

[lints.rust]
unsafe_code = "forbid"
