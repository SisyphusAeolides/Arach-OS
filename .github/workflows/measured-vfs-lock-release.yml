name: Measured VFS lock release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - run: cargo update -p corinth
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: git diff --check
      - name: Publish regenerated lock
        run: |
          test "$(git diff --name-only | tr '\n' ' ')" = "Cargo.lock "
          git config user.name "SisyphusAeolides"
          git config user.email "37166405+SisyphusAeolides@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Regenerate measured VFS dependency lock"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
