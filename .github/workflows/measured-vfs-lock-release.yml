name: Transfer validated measured VFS lock

on:
  pull_request:
    types: [synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  transfer:
    if: github.event.pull_request.head.ref == 'measured-vfs-kernel'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: measured-vfs-kernel
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Transfer validated lock to clean branch
        run: |
          cp Cargo.lock /tmp/validated-Cargo.lock
          git fetch origin measured-vfs-kernel-clean
          git checkout -B measured-vfs-kernel-clean origin/measured-vfs-kernel-clean
          cp /tmp/validated-Cargo.lock Cargo.lock
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "Cargo.lock "
          git config user.name "SisyphusAeolides"
          git config user.email "37166405+SisyphusAeolides@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Transfer validated measured VFS dependency lock"
          git push origin HEAD:measured-vfs-kernel-clean
