name: Repair live identity

on:
  push:
    branches: [main]
    paths:
      - scripts/repair_live_identity.py
      - .github/workflows/ci-repair-live-identity.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply live identity repair
        run: |
          python3 scripts/repair_live_identity.py
          rm scripts/repair_live_identity.py
          git diff --check
      - name: Commit repaired contract identity
        run: |
          git config user.name 'SisyphusAeolides'
          git config user.email '37166405+SisyphusAeolides@users.noreply.github.com'
          git add scripts/assemble-live-root.sh scripts/test-live-root.sh scripts/repair_live_identity.py
          git commit -m 'fix: align live image identity'
          git pull --rebase origin main
          git push origin HEAD:main
