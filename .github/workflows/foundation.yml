name: Arach OS foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: scripts/verify-foundation.sh
      - run: scripts/verify-components.py --lock components.lock.toml --remote
      - run: git diff --check
