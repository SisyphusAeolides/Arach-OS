name: Advance release graph

on:
  push:
    branches: [main]
    paths:
      - scripts/advance_release_graph.py
      - scripts/repair_component_verifier.py
      - .github/workflows/ci-advance-release-graph.yml

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply verifier and component revisions
        run: |
          python3 scripts/repair_component_verifier.py
          python3 scripts/advance_release_graph.py
          cargo generate-lockfile
          rm scripts/repair_component_verifier.py scripts/advance_release_graph.py
          git diff --check
      - name: Validate release graph
        run: |
          python3 -m unittest scripts/test_verify_components.py
          cargo check --locked
          python3 scripts/verify-components.py \
            --lock components.lock.toml \
            --manifest Cargo.toml \
            --remote
      - name: Commit release graph
        run: |
          git config user.name 'SisyphusAeolides'
          git config user.email '37166405+SisyphusAeolides@users.noreply.github.com'
          git add Cargo.toml Cargo.lock components.lock.toml \
            scripts/verify-components.py scripts/test_verify_components.py \
            scripts/repair_component_verifier.py scripts/advance_release_graph.py
          git commit -m 'build: advance release graph'
          git pull --rebase origin main
          git push origin HEAD:main
