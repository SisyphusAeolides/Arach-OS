name: Repair foundation CI failures

on:
  push:
    branches: [main]
    paths:
      - scripts/repair_foundation_inputs.py
      - .github/workflows/ci-repair-foundation.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply foundation repair
        run: |
          python3 scripts/repair_foundation_inputs.py
          cargo generate-lockfile
          rm scripts/repair_foundation_inputs.py
          git diff --check
      - name: Commit repaired inputs
        run: |
          git config user.name 'SisyphusAeolides'
          git config user.email '37166405+SisyphusAeolides@users.noreply.github.com'
          git add Cargo.lock scripts/test-live-root.sh scripts/repair_foundation_inputs.py
          git commit -m 'fix: repair foundation validation inputs'
          git pull --rebase origin main
          git push origin HEAD:main
