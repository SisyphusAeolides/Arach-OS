name: Release source validation

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  format-and-verify:
    if: github.head_ref == 'release-format'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-format
          fetch-depth: 0
      - name: Install image build tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          dosfstools mtools squashfs-tools xorriso
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - run: cargo update -p corinth --precise c83ddacfc00399011c7fe198237fb5a74b43f5fb
      - run: cargo fmt --all
      - run: cargo check --locked --all-targets
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo run --locked --bin arach-compose -- verify --root .
      - run: scripts/verify-foundation.sh
      - run: git diff --check
      - name: Publish verified release sources
        run: |
          git rm .github/workflows/release-format.yml
          git config user.name "SisyphusAeolides"
          git config user.email "SisyphusAeolides@users.noreply.github.com"
          git add -A
          git commit -m "Verify Arach OS release sources"
          git push origin HEAD:release-format
