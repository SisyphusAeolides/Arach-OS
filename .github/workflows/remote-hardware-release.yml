name: Remote hardware release validation

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  format-and-verify:
    if: github.head_ref == 'remote-hardware-catalog'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: remote-hardware-catalog
          fetch-depth: 0
      - name: Install image build tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          dosfstools mtools squashfs-tools xorriso
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Refresh the exact HWD lock
        run: cargo update -p arach-hwd --precise 569c40a530fb8e5fe9fc618b97c7ae4a5795f634
      - name: Require repository parser in ISO contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/build-live-iso.sh")
          text = path.read_text(encoding="utf-8")
          anchor = "    usr/lib/arach/calamares/modules/arachhardware/main.py \\\n"
          addition = anchor + "    usr/lib/arach/calamares/modules/arachhardware/repository.py \\\n"
          if "usr/lib/arach/calamares/modules/arachhardware/repository.py" not in text:
              if anchor not in text:
                  raise SystemExit("Calamares hardware module anchor is missing")
              path.write_text(text.replace(anchor, addition, 1), encoding="utf-8")
          PY
      - run: cargo fmt --all
      - run: cargo check --locked --all-targets
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo run --locked --bin arach-compose -- verify --root .
      - run: scripts/verify-foundation.sh
      - run: git diff --check
      - name: Publish verified release sources
        run: |
          git rm .github/workflows/remote-hardware-release.yml
          git config user.name "SisyphusAeolides"
          git config user.email "SisyphusAeolides@users.noreply.github.com"
          git add -A
          git commit -m "Verify signed hardware catalog integration"
          git push origin HEAD:remote-hardware-catalog
