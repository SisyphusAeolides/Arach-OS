name: Production readiness

on:
  push:
    paths:
      - production/**
      - components.lock.toml
      - docs/*_GATE.md
      - docs/PRODUCTION_READINESS.md
      - scripts/verify_production_readiness.py
      - scripts/verify_release_channels.py
      - tests/test_production_readiness.py
      - tests/test_release_channels.py
      - .github/workflows/readiness.yml
  pull_request:
    paths:
      - production/**
      - components.lock.toml
      - docs/*_GATE.md
      - docs/PRODUCTION_READINESS.md
      - scripts/verify_production_readiness.py
      - scripts/verify_release_channels.py
      - tests/test_production_readiness.py
      - tests/test_release_channels.py
      - .github/workflows/readiness.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate readiness ledger
        run: python3 scripts/verify_production_readiness.py --root . --report
      - name: Test readiness invariants
        run: python3 -m unittest tests/test_production_readiness.py
      - name: Validate release integrity policy
        run: python3 scripts/verify_release_channels.py --root .
      - name: Test release integrity invariants
        run: python3 -m unittest tests/test_release_channels.py
      - name: Check repository whitespace
        run: git diff --check
