format = 1
distribution = "Arach OS"
artifact_layout = "corinth-v1"
# COSMIC is the only Arach OS desktop. The compatibility-named `crest` file
# belongs exclusively to the measured C0 boot bundle and is never a provider.

[[provider]]
name = "push"
artifact_prefix = "push-"
layout = "files"
required = true
files = [
  { source = "target/release/push", destination = "/system/push", mode = 493 },
]

[[provider]]
name = "corinth"
artifact_prefix = "corinth-"
layout = "files"
required = true
files = [
  { source = "target/x86_64-arach/release/corinth", destination = "/system/corinth", mode = 493 },
]

[[provider]]
name = "arach-hwd"
artifact_prefix = "arach-hwd-"
layout = "files"
required = true
files = [
  { source = "target/release/arach-hwd", destination = "/system/arach-hwd", mode = 493 },
  { source = "target/release/arach-hwd-catalog-sync", destination = "/system/arach-hwd-catalog-sync", mode = 493 },
  { source = "target/release/arach-hwd-qualify", destination = "/system/arach-hwd-qualify", mode = 493 },
]

[[provider]]
name = "arach-hardware-catalog"
artifact_prefix = "arach-hardware-catalog-"
layout = "tree"
required = true
required_tree_path = [
  "/etc/arach/hwd/keys.toml",
  "/etc/arach/hwd/driver-abi",
  "/etc/arach/hwd/catalog.lock",
  "/etc/arach/hwd/packages.toml",
  "/etc/arach/hwd/packages.toml.sig",
  "/etc/arach/hwd/driver-sources/modules.alias",
  "/etc/arach/hwd/driver-sources/modules.dep",
  "/etc/arach/hwd/driver-sources/modules.builtin",
  "/etc/arach/hwd/driver-sources/modules.firmware",
  "/etc/arach/hwd/driver-sources/modules.builtin.modinfo",
]
files = []

[[provider]]
name = "dbus-broker"
artifact_prefix = "dbus-broker-"
layout = "files"
required = true
files = [
  { source = "usr/bin/dbus-broker-launch", destination = "/system/dbus-broker-launch", mode = 493 },
]

[[provider]]
name = "seatd"
artifact_prefix = "seatd-"
layout = "tree"
required = true
required_tree_path = [
  "/usr/bin/seatd",
]
aliases = [
  { source = "/usr/bin/seatd", destination = "/system/seatd", mode = 493 },
]
files = []

[[provider]]
name = "pipewire"
artifact_prefix = "pipewire-"
layout = "tree"
required = true
required_tree_path = [
  "/usr/bin/pipewire",
  "/usr/bin/pipewire-pulse",
]
aliases = [
  { source = "/usr/bin/pipewire", destination = "/system/pipewire", mode = 493 },
  { source = "/usr/bin/pipewire-pulse", destination = "/system/pipewire-pulse", mode = 493 },
]
files = []

[[provider]]
name = "wireplumber"
artifact_prefix = "wireplumber-"
layout = "tree"
required = true
required_tree_path = [
  "/usr/bin/wireplumber",
]
aliases = [
  { source = "/usr/bin/wireplumber", destination = "/system/wireplumber", mode = 493 },
]
files = []

[[provider]]
name = "greetd"
artifact_prefix = "greetd-"
layout = "files"
required = true
files = [
  { source = "target/release/greetd", destination = "/system/greetd", mode = 493 },
]

[[provider]]
name = "cosmic-desktop"
artifact_prefix = "cosmic-desktop-"
layout = "tree"
required = true
required_tree_path = [
  "/usr/bin/cosmic-comp",
  "/usr/bin/cosmic-greeter",
  "/usr/bin/cosmic-greeter-start",
  "/usr/bin/cosmic-session",
  "/usr/bin/cosmic-term",
  "/usr/bin/xdg-desktop-portal-cosmic",
  "/etc/greetd/cosmic-greeter.toml",
]
aliases = [
  { source = "/usr/bin/cosmic-comp", destination = "/system/cosmic-comp", mode = 493 },
  { source = "/usr/bin/cosmic-greeter", destination = "/system/cosmic-greeter", mode = 493 },
  { source = "/usr/bin/cosmic-session", destination = "/system/cosmic-session", mode = 493 },
  { source = "/usr/bin/cosmic-term", destination = "/system/cosmic-term", mode = 493 },
  { source = "/usr/bin/xdg-desktop-portal-cosmic", destination = "/system/xdg-desktop-portal-cosmic", mode = 493 },
  { source = "/etc/greetd/cosmic-greeter.toml", destination = "/etc/greetd/config.toml", mode = 420 },
]
files = []

[[provider]]
name = "firefox"
artifact_prefix = "firefox-"
layout = "tree"
required = true
required_tree_path = [
  "/usr/bin/firefox",
]
aliases = []
files = []

[[provider]]
name = "calamares"
artifact_prefix = "calamares-"
layout = "files"
required = true
files = [
  { source = "usr/bin/calamares", destination = "/usr/bin/calamares", mode = 493 },
]

[[provider]]
name = "arach-install"
artifact_prefix = "arach-os-"
layout = "files"
required = true
files = [
  { source = "target/release/arach-install", destination = "/usr/libexec/arach-install", mode = 493 },
  { source = "installer/calamares/settings.conf", destination = "/etc/calamares/settings.conf", mode = 420 },
  { source = "installer/calamares/modules/arachhardware.conf", destination = "/etc/calamares/modules/arach-hardware.conf", mode = 420 },
  { source = "installer/calamares/modules/arach-prepare.conf", destination = "/etc/calamares/modules/arach-prepare.conf", mode = 420 },
  { source = "installer/calamares/modules/arach-commit.conf", destination = "/etc/calamares/modules/arach-commit.conf", mode = 420 },
  { source = "installer/calamares/modules/partition.conf", destination = "/etc/calamares/modules/partition.conf", mode = 420 },
  { source = "installer/calamares/modules/users.conf", destination = "/etc/calamares/modules/users.conf", mode = 420 },
  { source = "installer/calamares/modules/unpackfs.conf", destination = "/etc/calamares/modules/unpackfs.conf", mode = 420 },
  { source = "installer/calamares/modules/arachhardware/module.desc", destination = "/usr/lib/arach/calamares/modules/arachhardware/module.desc", mode = 420 },
  { source = "installer/calamares/modules/arachhardware/main.py", destination = "/usr/lib/arach/calamares/modules/arachhardware/main.py", mode = 420 },
  { source = "installer/calamares/modules/arachhardware/repository.py", destination = "/usr/lib/arach/calamares/modules/arachhardware/repository.py", mode = 420 },
  { source = "installer/calamares/modules/arachtransaction/module.desc", destination = "/usr/lib/arach/calamares/modules/arachtransaction/module.desc", mode = 420 },
  { source = "installer/calamares/modules/arachtransaction/main.py", destination = "/usr/lib/arach/calamares/modules/arachtransaction/main.py", mode = 420 },
  { source = "installer/calamares/modules/arachtransaction/protocol.py", destination = "/usr/lib/arach/calamares/modules/arachtransaction/protocol.py", mode = 420 },
  { source = "installer/calamares/branding/arach/branding.desc", destination = "/usr/share/calamares/branding/arach/branding.desc", mode = 420 },
]

[[provider]]
name = "arach-branding"
artifact_prefix = "arach-os-"
layout = "files"
required = true
files = [
  { source = "branding/arach-logo.png", destination = "/usr/share/calamares/branding/arach/arach-logo.png", mode = 420 },
]
