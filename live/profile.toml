format = 1
distribution = "Arach OS"

[desktop]
package_bundle = "cosmic-desktop"
components = [
  "cosmic-applets",
  "cosmic-applibrary",
  "cosmic-bg",
  "cosmic-comp",
  "cosmic-edit",
  "cosmic-files",
  "cosmic-greeter",
  "cosmic-icons",
  "cosmic-idle",
  "cosmic-initial-setup",
  "cosmic-launcher",
  "cosmic-monitor",
  "cosmic-notifications",
  "cosmic-osd",
  "cosmic-panel",
  "cosmic-player",
  "cosmic-randr",
  "cosmic-screenshot",
  "cosmic-session",
  "cosmic-settings",
  "cosmic-settings-daemon",
  "cosmic-sound-theme",
  "cosmic-store",
  "cosmic-term",
  "cosmic-wallpapers",
  "cosmic-workspaces-epoch",
  "pop-launcher",
  "xdg-desktop-portal-cosmic",
]
display_manager = "greetd"
compositor = "cosmic-comp"
session = "cosmic-session"
greeter = "cosmic-greeter"
portal = "xdg-desktop-portal-cosmic"

[installer]
framework = "calamares"
transaction_engine = "arach-install"
branding = "branding/arach-logo.png"

[filesystems]
efi = ["fat32"]
root = ["btrfs", "ext4", "xfs", "f2fs"]
home = ["btrfs", "ext4", "xfs", "f2fs"]
experimental = ["bcachefs", "zfs"]

[hardware]
detector = "arach-hwd"
package_manager = "corinth"
preflight = "/system/arach-hwd"
preflight_report = "/run/arach-installer/hardware.toml"
catalog_profiles = "/etc/arach/hwd/profiles"
catalog_keyring = "/etc/arach/hwd/keys.toml"
catalog_lock = "/etc/arach/hwd/catalog.lock"
binary_index = "/etc/arach/hwd/packages.toml"
binary_signature = "/etc/arach/hwd/packages.toml.sig"
driver_abi = "/etc/arach/hwd/driver-abi"
plan = "/run/arach-installer/hardware.plan.toml"
capabilities = ["network", "wireless", "audio", "graphics", "storage", "input", "bluetooth", "firmware"]
allow_adapted_c_drivers = true
allow_unmatched_binary_kernel_modules = false
